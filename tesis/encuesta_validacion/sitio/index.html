<style>
/* Layout: una columna centrada tipo formulario por pasos (barra de progreso arriba, una tarjeta por paso, botones al pie) */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --surface-2: #eceef3; --line: #dbdfe7;
  --fg: #141823; --fg-2: #4a5263; --fg-3: #6f7788;
  --accent: #2f3d8a; --accent-soft: #e5e8f6;
  --z-vc: #1baf7a; --z-if: #eda100; --z-tn: #2a78d6; --z-np: #a3a9b5;
  --crit: #c23434;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #191c23; --surface-2: #222631; --line: #2d3240;
    --fg: #eef0f5; --fg-2: #b7bdca; --fg-3: #8b92a3; --accent: #9eabf2; --accent-soft: #252b47;
    --z-vc: #199e70; --z-if: #c98500; --z-tn: #3987e5; --z-np: #5d6372; --crit: #e66767; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #191c23; --surface-2: #222631; --line: #2d3240;
  --fg: #eef0f5; --fg-2: #b7bdca; --fg-3: #8b92a3; --accent: #9eabf2; --accent-soft: #252b47;
  --z-vc: #199e70; --z-if: #c98500; --z-tn: #3987e5; --z-np: #5d6372; --crit: #e66767; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; margin: 0; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.sutil { color: var(--fg-3); font-size: 0.88rem; }
.etiqueta { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); font-weight: 700; }

.cab { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.cab-in { max-width: 760px; margin: 0 auto; padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 8px; }
.cab-fila { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cab h1 { font-size: 1.05rem; }
.pasos { display: flex; gap: 4px; }
.pasos i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-2); }
.pasos i.hecho { background: var(--accent); }
.pasos i.actual { background: color-mix(in srgb, var(--accent) 45%, var(--surface-2)); }

.marco { max-width: 760px; margin: 0 auto; padding-block: 24px 64px; padding-inline: 16px; }
.tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.tarjeta h2 { font-size: 1.45rem; }
.lead { font-size: 1.05rem; color: var(--fg-2); margin: 0; max-width: 60ch; }
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo label, .campo .lbl { font-weight: 600; }
select, input[type="text"], input[type="number"] { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); width: 100%; }
.fila-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 560px) { .fila-2 { grid-template-columns: minmax(0, 1fr); } }
.error { color: var(--crit); font-size: 0.88rem; min-height: 1.2em; margin: 0; }
.pie { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.boton { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); padding: 11px 22px; border-radius: 10px; cursor: pointer; font-weight: 700; }
.boton.sec { background: transparent; color: var(--accent); }
.boton:disabled { opacity: 0.45; cursor: not-allowed; }
.aviso { padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); font-size: 0.95rem; }
.aviso.proto { background: color-mix(in srgb, var(--z-if) 16%, transparent); font-size: 0.85rem; color: var(--fg-2); }

/* Notas */
table.notas { width: 100%; border-collapse: collapse; }
table.notas th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-3); padding: 0 6px 8px; }
table.notas td { padding: 6px; border-top: 1px solid var(--line); }
table.notas td:first-child { font-weight: 600; }
table.notas input { max-width: 110px; text-align: center; font-family: var(--font-data); }
.col2[hidden] { display: none; }
.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 600; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* Preguntas */
.recuerda { font-size: 0.95rem; }
.preguntas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.preguntas li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 12px; }
.preguntas li.ok { background: var(--surface-2); }
.preguntas li:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.sn { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sn button { border: 0; background: var(--surface); padding: 10px 20px; cursor: pointer; font-weight: 700; color: var(--fg-2); }
.sn button + button { border-left: 1px solid var(--line); }
.sn button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
@media (max-width: 520px) { .preguntas li { grid-template-columns: minmax(0, 1fr); } .preguntas .sn { justify-self: end; } }

/* Escala y opciones */
.escala { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.escala button, .opciones button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--fg-2); }
.escala button b { font-family: var(--font-data); font-size: 1.15rem; color: var(--fg); }
.escala button span { font-size: 0.72rem; text-align: center; }
.escala button[aria-checked="true"], .opciones button[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.opciones button { flex-direction: row; padding: 9px 14px; font-weight: 600; }

/* Resultado */
.figuras { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.figura { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 14px 10px; border-radius: 12px; background: var(--surface-2); }
.figura > div:first-child { width: 84px; }
.figura svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 5px 8px rgb(15 23 42 / 0.14)); }
.figura .nm { font-family: var(--font-display); font-weight: 700; line-height: 1.2; }
.figura .pc { font-family: var(--font-data); font-weight: 700; }
.figura .pc .sutil { font-family: var(--font-body); font-weight: 400; }
@media (max-width: 560px) { .figuras { grid-template-columns: minmax(0, 1fr); } }
.propia { padding: 14px; border-radius: 12px; border: 1px solid var(--line); display: flex; gap: 14px; align-items: center; }
.propia .pos { font-family: var(--font-display); font-size: 2rem; font-weight: 800; line-height: 1; }
.areas-r { display: flex; flex-direction: column; gap: 10px; }
.area-r { display: grid; grid-template-columns: 130px minmax(0, 1fr) minmax(0, 1fr); gap: 6px 14px; align-items: center; font-size: 0.9rem; }
.area-r .bar { display: grid; grid-template-columns: minmax(0, 1fr) 28px; gap: 6px; align-items: center; }
.bar-t { position: relative; height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar-t i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 5px; }
.bar-t .m { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--surface); }
.areas-cab { display: grid; grid-template-columns: 130px minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 560px) { .area-r, .areas-cab { grid-template-columns: 104px minmax(0, 1fr) minmax(0, 1fr); gap: 6px 10px; } .area-r { font-size: 0.82rem; } }
.vacio { text-align: center; color: var(--fg-3); }

/* Materias agregadas */
.extra { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.extra .lbl { font-weight: 600; }
#extras { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.fila-extra { display: grid; grid-template-columns: minmax(0, 1fr) 90px 90px 40px; gap: 8px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.fila-extra:not(:has(.x-n2)) { grid-template-columns: minmax(0, 1fr) 90px 40px; }
.fila-extra input[type="number"] { text-align: center; font-family: var(--font-data); }
.x-info { grid-column: 1 / -1; }
.x-info select { max-width: 340px; }
.quitar { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; font-size: 1.2rem; color: var(--fg-3); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
table.notas td:last-child { width: 48px; }
.quitadas { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0; }
.restaurar { border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; cursor: pointer; color: var(--fg-2); font-size: 0.82rem; }
.restaurar:hover { border-color: var(--accent); color: var(--accent); }

/* Barra de avance verde */
.avance { display: flex; align-items: center; gap: 10px; }
.avance-t { flex: 1; height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.avance-t i { display: block; height: 100%; width: 0; background: var(--z-vc); border-radius: 5px; transition: width 0.3s ease; }
.avance b { font-size: 0.85rem; color: var(--fg-2); min-width: 74px; text-align: right; }
@media (prefers-reduced-motion: reduce) { .avance-t i { transition: none; } }

/* El atributo hidden siempre oculta, aunque la clase tenga display */
[hidden] { display: none !important; }

</style>

<script>
/* Motor del modelo en el navegador.
   Aplica las MISMAS fórmulas del Módulo 5 (posterior gaussiano exacto) y del Módulo 7 (afinidad + Monte Carlo)
   con los parámetros que el Colab ya aprendió (cohorte.json → modelo). No entrena nada: solo recalcula
   a un estudiante cuando se registra una nueva aplicación del CHASIDE. */
(() => {
  'use strict';
  const CODIGOS = ['C', 'H', 'A', 'S', 'I', 'D', 'E'];

  // Φ con precisión ~1e-7 (Abramowitz–Stegun 7.1.26 sobre erf)
  function phi(z) {
    const t = 1 / (1 + 0.3275911 * Math.abs(z) / Math.SQRT2);
    const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-z * z / 2);
    return 0.5 * (1 + (z >= 0 ? y : -y));
  }

  // P(X > h, Y > k) para normal bivariada estándar con correlación r (algoritmo de Genz, bvnu)
  function bvnu(h, k, r) {
    const tp = 2 * Math.PI;
    let w, x;
    if (Math.abs(r) < 0.3) { w = [0.1713244923791705, 0.3607615730481384, 0.4679139345726904]; x = [0.9324695142031522, 0.6612093864662647, 0.2386191860831970]; }
    else if (Math.abs(r) < 0.75) { w = [0.04717533638651177, 0.1069393259953183, 0.1600783285433464, 0.2031674267230659, 0.2334925365383547, 0.2491470458134029]; x = [0.9815606342467191, 0.9041172563704750, 0.7699026741943050, 0.5873179542866171, 0.3678314989981802, 0.1252334085114692]; }
    else { w = [0.01761400713915212, 0.04060142980038694, 0.06267204833410906, 0.08327674157670475, 0.1019301198172404, 0.1181945319615184, 0.1316886384491766, 0.1420961093183821, 0.1491729864726037, 0.1527533871307259]; x = [0.9931285991850949, 0.9639719272779138, 0.9122344282513259, 0.8391169718222188, 0.7463319064601508, 0.6360536807265150, 0.5108670019508271, 0.3737060887154196, 0.2277858511416451, 0.07652652113349733]; }
    let hk = h * k, bvn = 0;
    if (Math.abs(r) < 0.925) {
      const hs = (h * h + k * k) / 2, asr = Math.asin(r) / 2;
      for (let i = 0; i < w.length; i++) {
        let sn = Math.sin(asr * (1 - x[i])); bvn += w[i] * Math.exp((sn * hk - hs) / (1 - sn * sn));
        sn = Math.sin(asr * (1 + x[i])); bvn += w[i] * Math.exp((sn * hk - hs) / (1 - sn * sn));
      }
      bvn = bvn * asr / tp + phi(-h) * phi(-k);
    } else {
      if (r < 0) { k = -k; hk = -hk; }
      if (Math.abs(r) < 1) {
        const as = (1 - r) * (1 + r); let a = Math.sqrt(as);
        const bs = (h - k) ** 2, c = (4 - hk) / 8, d = (12 - hk) / 16;
        bvn = a * Math.exp(-(bs / as + hk) / 2) * (1 - c * (bs - as) * (1 - d * bs / 5) / 3 + c * d * as * as / 5);
        if (hk > -160) { const b = Math.sqrt(bs); bvn -= Math.exp(-hk / 2) * Math.sqrt(tp) * phi(-b / a) * b * (1 - c * bs * (1 - d * bs / 5) / 3); }
        a /= 2;
        for (let i = 0; i < w.length; i++) {
          for (const sg of [-1, 1]) {
            const xs = (a * (sg * x[i] + 1)) ** 2, rs = Math.sqrt(1 - xs), asr = -(bs / xs + hk) / 2;
            if (asr > -100) bvn += a * w[i] * Math.exp(asr) * (Math.exp(-hk * xs / (2 * (1 + rs) ** 2)) / rs - (1 + c * xs * (1 + d * xs)));
          }
        }
        bvn = -bvn / tp;
      }
      if (r > 0) bvn += phi(-Math.max(h, k));
      else if (h >= k) bvn = -bvn;
      else bvn = (h < 0 ? phi(k) - phi(h) : phi(-h) - phi(-k)) - bvn;
    }
    return Math.max(0, Math.min(1, bvn));
  }

  /* ── Módulo 4: respuestas → evidencia por área ── */
  function evidenciaChaside(M, respuestas, meta) {
    // respuestas: {numero_item: 1 | 0 | null}
    const porArea = {};
    CODIGOS.forEach(a => { porArea[a] = { interes: [0, 0], aptitud: [0, 0] }; });
    let resp = 0, si = 0;
    M.claves.forEach(([item, a, t]) => {
      const v = respuestas[item];
      if (v === 0 || v === 1) { porArea[a][t][1]++; porArea[a][t][0] += v; resp++; si += v; }
    });
    const punt = {}, z = {};
    CODIGOS.forEach(a => {
      punt[a] = {};
      ['interes', 'aptitud'].forEach(t => {
        const [s, n] = porArea[a][t], [m, sd] = M.normas_chaside[a][t];
        punt[a][t] = n ? s / n : null;
        z[a] = z[a] || {};
        z[a][t] = n ? (s / n - m) / sd : null;
      });
    });
    const total = M.claves.length, comp = resp / total;
    const ints = CODIGOS.map(a => punt[a].interes).filter(v => v != null);
    const media = ints.reduce((x, y) => x + y, 0) / (ints.length || 1);
    const disp = Math.sqrt(ints.reduce((x, y) => x + (y - media) ** 2, 0) / Math.max(1, ints.length - 1));
    const propSi = resp ? si / resp : 0;
    const crit = {
      antiguedad: 'menos_1_anio',
      modalidad: meta.modalidad || 'supervisada',
      completitud: comp >= 0.95 ? 'completa' : comp >= 0.8 ? 'parcial' : 'incompleta',
      consistencia: (disp < M.consistencia.disp_p05 && propSi >= M.consistencia.rango_si[0] && propSi <= M.consistencia.rango_si[1]) ? 'alerta' : 'sin_alertas',
      completitud_pct: Math.round(comp * 100)
    };
    const conteos = {};
    CODIGOS.forEach(a => { conteos[a] = { interes: porArea[a].interes.slice(), aptitud: porArea[a].aptitud.slice() }; });
    return { z, crit, origen: { respondidas: resp, total, si, areas: conteos } };
  }

  /* ── Módulo 5: posterior gaussiano exacto por área ── */
  function s2Fuente(M, alfa, crit) {
    let f = 1;
    ['antiguedad', 'modalidad', 'completitud', 'consistencia'].forEach(c => { if (crit[c]) f *= M.rubrica[c][crit[c]]; });
    return (1 - alfa) / alfa * f;   // validación publicada y equivalencia directa: factor 1
  }
  function posteriorArea(M, a, ev, crit) {
    const p = M.param[a], rho = p.rho;
    const det = 1 - rho * rho;
    let L = [[1 / det, -rho / det], [-rho / det, 1 / det]], b = [0, 0];
    const obs = [];
    if (ev.z_int != null) {
      const al = M.alfa_chaside[a].interes;
      obs.push(['chaside_interes', [1, 0], ev.z_int / Math.sqrt(al), s2Fuente(M, al, crit)]);
    }
    if (ev.z_notas != null) {
      const an = p.alfa_notas, fw = ev.W_efectiva != null ? Math.min(3, Math.max(0.5, p.W_med / ev.W_efectiva)) : 1;
      obs.push(['notas', [0, 1], ev.z_notas / Math.sqrt(an), (1 - an) / an * fw]);
    }
    if (ev.z_apt != null) {
      const lam = p.lam_apt;
      obs.push(['autopercepcion', [0, 1], ev.z_apt / lam, s2Fuente(M, lam * lam, crit)]);
    }
    obs.forEach(([, H, y, s2]) => {
      L = [[L[0][0] + H[0] * H[0] / s2, L[0][1] + H[0] * H[1] / s2], [L[1][0] + H[1] * H[0] / s2, L[1][1] + H[1] * H[1] / s2]];
      b = [b[0] + H[0] * y / s2, b[1] + H[1] * y / s2];
    });
    const d = L[0][0] * L[1][1] - L[0][1] * L[1][0];
    const S = [[L[1][1] / d, -L[0][1] / d], [-L[1][0] / d, L[0][0] / d]];
    const mu = [S[0][0] * b[0] + S[0][1] * b[1], S[1][0] * b[0] + S[1][1] * b[1]];
    const aportes = {};
    obs.forEach(([n, H, y, s2]) => { const v = [H[0] * y / s2, H[1] * y / s2]; aportes[n] = [S[0][0] * v[0] + S[0][1] * v[1], S[1][0] * v[0] + S[1][1] * v[1]]; });
    return { mu, S, aportes };
  }
  function zona(M, mu, S) {
    const sI = Math.sqrt(S[0][0]), sR = Math.sqrt(S[1][1]);
    const pI = phi(mu[0] / sI), pR = phi(mu[1] / sR);
    const pAA = bvnu(-mu[0] / sI, -mu[1] / sR, S[0][1] / (sI * sR));
    const probs = { vocacion_consolidada: pAA, interes_a_fortalecer: pI - pAA, talento_no_explorado: pR - pAA, no_prioritaria: 1 - pI - pR + pAA };
    const mejor = Object.keys(probs).reduce((x, y) => probs[y] > probs[x] ? y : x);
    return { clave: probs[mejor] >= M.umbral_certeza ? mejor : 'indeterminado', certeza: probs[mejor], probabilidades: probs };
  }
  const TXT_ZONA = { vocacion_consolidada: 'Vocación consolidada', interes_a_fortalecer: 'Interés a fortalecer', talento_no_explorado: 'Talento no explorado', no_prioritaria: 'Área no prioritaria', indeterminado: 'Indeterminado: falta evidencia' };
  const eje = (mu, sd) => ({ percentil: Math.round(phi(mu) * 100), rango90: [Math.round(phi(mu - 1.645 * sd) * 100), Math.round(phi(mu + 1.645 * sd) * 100)], z: mu, sd });

  /* ── Módulo 7: afinidad equilibrada + Monte Carlo ── */
  function afinidadCruda(C, gamma, s) {
    return C.map(c => {
      const w = CODIGOS.map(k => Math.pow((c.perfil[k] - 1) / 4, gamma)), sw = w.reduce((x, y) => x + y, 0) || 1;
      return 100 * CODIGOS.reduce((acc, k, i) => acc + w[i] / sw * s[i], 0);
    });
  }
  function afinidad(C, gamma, normas, beta, MU) {
    const s = MU.map(([i, r]) => beta * phi(i) + (1 - beta) * phi(r));
    const x = afinidadCruda(C, gamma, s), n = normas[beta.toFixed(1)];
    return x.map((v, j) => n ? 100 * phi((v - n.media[j]) / n.sd[j]) : v);
  }
  function rng(semilla) {   // mulberry32 + Box–Muller
    let a = semilla >>> 0;
    const u = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    return () => Math.sqrt(-2 * Math.log(u() + 1e-12)) * Math.cos(2 * Math.PI * u());
  }
  function monteCarlo(C, gamma, normas, beta, MU, SIG, n, k) {
    const g = rng(20261004), cuenta = new Array(C.length).fill(0), muestras = C.map(() => []);
    const Ls = SIG.map(S => { const l00 = Math.sqrt(S[0][0]), l10 = S[1][0] / l00; return [l00, l10, Math.sqrt(Math.max(1e-12, S[1][1] - l10 * l10))]; });
    for (let t = 0; t < n; t++) {
      const draw = MU.map(([m0, m1], a) => { const e0 = g(), e1 = g(), L = Ls[a]; return [m0 + L[0] * e0, m1 + L[1] * e0 + L[2] * e1]; });
      const A = afinidad(C, gamma, normas, beta, draw);
      const top = A.map((v, j) => [v, j]).sort((x, y) => y[0] - x[0]).slice(0, k);
      top.forEach(([, j]) => cuenta[j]++);
      A.forEach((v, j) => muestras[j].push(v));
    }
    const q = (arr, p) => { const s = arr.slice().sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; };
    return { p: cuenta.map(c => c / n), lo: muestras.map(m => q(m, 0.05)), hi: muestras.map(m => q(m, 0.95)) };
  }

  /* ── Recalcular un estudiante completo con un CHASIDE nuevo ── */
  function recalcular(M, carrerasCat, est, respuestas, meta) {
    const E = evidenciaChaside(M, respuestas, meta);
    const N = JSON.parse(JSON.stringify(est));
    const crit = E.crit;
    N.areas.forEach(ar => {
      const a = ar.codigo, ev0 = ar.evidencia || {};
      const ev = { z_int: E.z[a].interes, z_apt: E.z[a].aptitud, z_notas: ev0.z_notas, W_efectiva: ev0.W_efectiva };
      const { mu, S, aportes } = posteriorArea(M, a, ev, crit);
      const zn = zona(M, mu, S);
      ar.interes = eje(mu[0], Math.sqrt(S[0][0])); ar.rendimiento = eje(mu[1], Math.sqrt(S[1][1]));
      ar.zona = { clave: zn.clave, texto: TXT_ZONA[zn.clave], certeza: zn.certeza, probabilidades: zn.probabilidades };
      ar.aportes = { interes: { chaside_interes: aportes.chaside_interes ? aportes.chaside_interes[0] : null },
                     rendimiento: { notas: aportes.notas ? aportes.notas[1] : null, autopercepcion: aportes.autopercepcion ? aportes.autopercepcion[1] : null } };
      if (ev.z_apt != null && ev.z_notas != null) {
        const r = M.param[a].r_apt_notas, br = (ev.z_apt - r * ev.z_notas) / Math.sqrt(1 - r * r);
        const k = br > 1 ? 'por_encima' : br < -1 ? 'por_debajo' : 'coherente';
        ar.autopercepcion = { clave: k, texto: { por_encima: 'se percibe por ENCIMA de sus notas', por_debajo: 'se percibe por DEBAJO de sus notas', coherente: 'coherente con sus notas' }[k] };
      }
      ar.evidencia = ev; ar._S = S;
    });
    // Carreras
    const MU = N.areas.map(a => [a.interes.z, a.rendimiento.z]), SIG = N.areas.map(a => a._S);
    const C = carrerasCat.lista, A = afinidad(C, carrerasCat.gamma, carrerasCat.normas, M.beta, MU);
    const mc = monteCarlo(C, carrerasCat.gamma, carrerasCat.normas, M.beta, MU, SIG, M.n_sim, M.top_k);
    const orden = A.map((v, j) => [v, j]).sort((x, y) => y[0] - x[0]).slice(0, 10);
    N.carreras = orden.map(([v, j]) => ({ id: C[j].id, nombre: C[j].nombre, afinidad: Math.round(v * 10) / 10, rango90: [Math.round(mc.lo[j] * 10) / 10, Math.round(mc.hi[j] * 10) / 10],
      p_top5: Math.round(mc.p[j] * 100) / 100, universidad: C[j].universidad, ciudad: C[j].ciudad, razon: razon(N, C[j], carrerasCat.gamma, M.beta) }));
    N.areas.forEach(a => { delete a._S; });
    // Fuentes, origen y alertas
    N.estudiante.fuentes.chaside = { fecha: meta.fecha, modalidad: crit.modalidad, completitud: crit.completitud, consistencia: crit.consistencia };
    N.origen = { ...(N.origen || {}), chaside: E.origen };
    const al = (N.alertas || []).filter(x => !['consistencia', 'completitud', 'antiguedad', 'modalidad', 'indeterminado'].includes(x.tipo));
    if (crit.consistencia === 'alerta') al.unshift({ tipo: 'consistencia', texto: 'CHASIDE con respuestas poco diferenciadas: confirmar intereses en entrevista.' });
    if (crit.completitud !== 'completa') al.unshift({ tipo: 'completitud', texto: `CHASIDE ${crit.completitud} (${crit.completitud_pct} % respondido).` });
    if (crit.modalidad === 'autonoma') al.push({ tipo: 'modalidad', texto: 'CHASIDE respondido sin supervisión: su confiabilidad se ajustó a la baja.' });
    const nInd = N.areas.filter(a => a.zona.clave === 'indeterminado').length;
    if (nInd >= 3) al.push({ tipo: 'indeterminado', texto: `${nInd} de 7 áreas sin zona clara: falta evidencia (sumar entrevista u otra prueba).` });
    N.alertas = al;
    return N;
  }
  function razon(N, c, gamma, beta) {
    const ap = N.areas.map(a => ({ a, v: Math.pow((c.perfil[a.codigo] - 1) / 4, gamma) * (beta * phi(a.interes.z) + (1 - beta) * phi(a.rendimiento.z)) })).sort((x, y) => y.v - x.v);
    const a = ap[0].a, pI = a.interes.percentil, pR = a.rendimiento.percentil;
    let t = `${a.nombre} (pesa ${c.perfil[a.codigo]}/5 en la carrera): interés P${pI}, rendimiento P${pR}`;
    const mats = (a.materias_clave || []).filter(m => m.nota != null).map(m => `${m.materia} ${m.nota.toFixed(1)}`);
    if (mats.length) t += ' · materias: ' + mats.join(', ');
    if (pI >= 60 && pR < 40) t += ' · interés alto, conviene reforzar el rendimiento';
    else if (pR >= 60 && pI < 40) t += ' · rinde bien aunque declara poco interés';
    if (ap[1].v >= 0.5 * ap[0].v) t += ` · también suma ${ap[1].a.nombre}`;
    return t;
  }

  window.MOTOR = { phi, bvnu, evidenciaChaside, posteriorArea, zona, recalcular, afinidad };
})();

</script>

  const ITEMS = M.claves.map(([n]) => n).sort((a, b) => a - b).map(n => ({ n, texto: M.preguntas?.[n] || `Pregunta ${n}` }));

  const POR_PAG = 10, PAGINAS = Math.ceil(ITEMS.length / POR_PAG);

  const opcionesCarrera = sel => {

  };

  // Avance total: el test es la parte larga, así que pesa la mayor parte de la barra
  function avance() {

    return Math.round(20 + 72 * hechas / ITEMS.length);
  }
  function pintarProgreso() {

  }

    if (S.paso === 1) v.innerHTML = `<div class="tarjeta"><h2>Tu perfil</h2>
        <div class="campo"><label for="colegio">¿En qué tipo de colegio te graduaste?</label><select id="colegio"><option value="">Elige…</option>${COLEGIOS.map(c => `<option${c === S.perfil.colegio ? ' selected' : ''}>${c}</option>`).join('')}</select></div>
        <div class="campo"><label for="carrera">¿Qué carrera estudias?</label><select id="carrera">${opcionesCarrera(S.perfil.carrera)}</select></div>

        <div class="campo"><label for="semestre">¿En qué semestre estás?</label><select id="semestre"><option value="">Elige…</option>${SEMESTRES.map(c => `<option${c === S.perfil.semestre ? ' selected' : ''}>${c}</option>`).join('')}</select></div>

    if (S.paso === 5) pintarResultado(v);
    enlazar();
  }

  function textoClasif(x) {
    const c = clasificar(x.nombre);
    if (!x.nombre.trim()) return { html: '<span class="sutil">Escribe el nombre de la materia.</span>', manual: false };
    if (c && !c.incluir) return { html: '<span class="sutil">No académica: no se usa en el cálculo.</span>', manual: false };
    if (c) return { html: `<span class="sutil">Aporta a: ${Object.keys(c.pesos).map(a => CORTO[a]).join(', ')}</span>`, manual: false };

  function filaExtra(x, i) {
    const t = textoClasif(x);
    return `<div class="fila-extra" data-x="${i}">
      <input type="text" class="x-nombre" placeholder="Nombre de la materia" value="${esc(x.nombre)}" maxlength="60" aria-label="Nombre de la materia">
      <input type="number" class="x-n3" inputmode="decimal" min="0" max="10" step="0.01" placeholder="3.º" value="${x.n3 ?? ''}" aria-label="Nota de 3.º">
      ${S.con2 ? `<input type="number" class="x-n2" inputmode="decimal" min="0" max="10" step="0.01" placeholder="2.º" value="${x.n2 ?? ''}" aria-label="Nota de 2.º">` : ''}
      <button type="button" class="quitar" aria-label="Quitar materia">×</button>
      <div class="x-info">${t.html}${t.manual ? `<select class="x-area" aria-label="Área relacionada"><option value="">¿Con qué se relaciona?</option>${CODIGOS.map(a => `<option value="${a}"${x.area === a ? ' selected' : ''}>${esc(AREAS[a])}</option>`).join('')}<option value="ninguna"${x.area === 'ninguna' ? ' selected' : ''}>No sé (no se usará)</option></select>` : ''}</div>
    </div>`;
  }
  function pesosExtra(x) {
    const c = clasificar(x.nombre);
    if (c) return c.incluir ? c.pesos : null;
    return x.area && x.area !== 'ninguna' ? { [x.area]: 3 } : null;
  }

  function pintarTest(v) {
    if (!S.tChasideIni) S.tChasideIni = Date.now();
    const lote = ITEMS.slice(S.pagina * POR_PAG, (S.pagina + 1) * POR_PAG);
    const resp = it => it.aten != null ? S.aten[it.aten] : S.resp[it.n];
    v.innerHTML = `<div class="tarjeta">
      <div class="recuerda aviso"><b>Ubícate en el pasado:</b> responde como eras en el último año del colegio, <b>antes</b> de elegir tu carrera. No pienses en lo que haces hoy en la universidad.</div>
      <div class="pie"><h2>Test de intereses</h2><span class="sutil">Página ${S.pagina + 1} de ${PAGINAS}</span></div>
      <ol class="preguntas">${lote.map((it, k) => { const r = resp(it), key = it.aten != null ? 'a' + it.aten : it.n;
        return `<li tabindex="0" data-k="${key}" class="${r != null ? 'ok' : ''}"><span>${esc(it.texto)}</span>
          <span class="sn"><button type="button" data-v="1" aria-pressed="${r === 1}">Sí</button><button type="button" data-v="0" aria-pressed="${r === 0}">No</button></span></li>`; }).join('')}</ol>
      <p class="sutil">Atajo en computadora: teclas S y N.</p>
      <p class="error" id="err"></p>
      <div class="pie"><button class="boton sec" id="ant">Atrás</button><button class="boton" id="sig">${S.pagina === PAGINAS - 1 ? 'Terminar el test' : 'Siguiente'}</button></div></div>`;
  }

  /* ── Cálculo con el modelo (persona individual, normas fijas) ── */
  function evidenciaNotas() {
    const porArea = {};
    CODIGOS.forEach(a => { porArea[a] = { wz3: 0, w3: 0, wz2: 0, w2: 0, mats: [] }; });
    MATERIAS.forEach(([m, pesos], i) => {
      [[S.notas3[i], '3'], [S.con2 ? S.notas2[i] : null, '2']].forEach(([n, anio]) => {
        if (n == null || n === '') return;
        const z = (n - NORMA_NOTA.media) / NORMA_NOTA.sd;
        Object.entries(pesos).forEach(([a, w]) => {
          porArea[a]['wz' + anio] += w * z; porArea[a]['w' + anio] += w;
          if (anio === '3') porArea[a].mats.push({ materia: m.replace(' (si la tuviste)', ''), nota: +n, peso: w });
        });
      });
    });
    S.extra.forEach(x => {
      const pesos = pesosExtra(x); if (!pesos) return;
      [[x.n3, '3'], [S.con2 ? x.n2 : null, '2']].forEach(([n, anio]) => {
        if (n == null || n === '' || isNaN(n)) return;
        const z = (n - NORMA_NOTA.media) / NORMA_NOTA.sd;
        Object.entries(pesos).forEach(([a, w]) => {
          porArea[a]['wz' + anio] += w * z; porArea[a]['w' + anio] += w;
          if (anio === '3') porArea[a].mats.push({ materia: x.nombre.trim(), nota: +n, peso: w });
        });
      });
    });
    const ev = {};
    CODIGOS.forEach(a => {
      const p = porArea[a], R3 = p.w3 ? p.wz3 / p.w3 : null, R2 = p.w2 ? p.wz2 / p.w2 : null;
      const pes3 = p.w3, pes2 = GAMMA_ANIO * p.w2, W = pes3 + pes2;
      const R = W ? ((R3 ?? 0) * pes3 + (R2 ?? 0) * pes2) / W : null;
      ev[a] = { z_notas: R == null ? null : R / SD_AREA[a], W_efectiva: W || null,
                materias_clave: p.mats.sort((x, y) => y.peso - x.peso || y.nota - x.nota).slice(0, 3) };
    });
    return ev;
  }
  function calcular() {
    const ev = evidenciaNotas();
    const base = {
      estudiante: { id: codigo, nombre, nombre_ficticio: true, genero: null, grado_actual: null, fuentes: { notas: {}, chaside: {}, ippj: null } },
      areas: CODIGOS.map(a => ({ codigo: a, nombre: AREAS[a], materias_clave: ev[a].materias_clave, evidencia: { z_notas: ev[a].z_notas, W_efectiva: ev[a].W_efectiva } })),
      alertas: [], origen: {}, carreras: [], trayectoria: []
    };
    const N = window.MOTOR.recalcular(M, CAT, base, S.resp, { fecha: new Date().toISOString().slice(0, 10), modalidad: 'autonoma' });
    // Posición de su carrera real en el ranking completo
    const MU = N.areas.map(a => [a.interes.z, a.rendimiento.z]);
    const A = window.MOTOR.afinidad(CAT.lista, CAT.gamma, CAT.normas, M.beta, MU);
    const orden = A.map((v, j) => [v, j]).sort((x, y) => y[0] - x[0]);
    const j = CAT.lista.findIndex(c => c.id === S.perfil.carrera);
    N.propia = j >= 0 ? { posicion: orden.findIndex(([, k]) => k === j) + 1, afinidad: A[j], nombre: CAT.lista[j].nombre } : null;
    N.ranking_ids = orden.slice(0, 10).map(([, k]) => CAT.lista[k].id);
    return N;
  }

  /* ── Envío ── */
  function filaPlana(N) {
    const f = {
      version: VERSION, codigo, nombre_ficticio: nombre, fecha: new Date().toISOString(),
      duracion_total_seg: Math.round((Date.now() - S.t0) / 1000),
      duracion_chaside_seg: S.tChasideFin && S.tChasideIni ? Math.round((S.tChasideFin - S.tChasideIni) / 1000) : '',
      tipo_colegio: S.perfil.colegio, carrera_id: S.perfil.carrera, carrera_otra: S.perfil.otra || '', semestre: S.perfil.semestre,
      satisfaccion: S.final.satisfaccion, primera_opcion: S.final.primera, motivo: S.final.motivo, cambiaria: S.final.cambiaria,
      otra_considerada_1: S.final.otra1 || '', otra_considerada_2: S.final.otra2 || '',
      atencion_ok: ATENCION.every((a, i) => S.aten[i] === a.esperado) ? 1 : 0
    };
    MATERIAS.forEach(([m], i) => {
      const k = m.replace(' (si la tuviste)', '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]+/g, '_');
      f['n3_' + k] = S.notas3[i] ?? ''; f['n2_' + k] = S.con2 ? (S.notas2[i] ?? '') : '';
    });
    f.materias_quitadas = S.quitadas.map(i => MATERIAS[i][0].replace(' (si la tuviste)', '')).join('|');
    f.otras_materias = JSON.stringify(S.extra.map(x => ({ materia: x.nombre.trim(), n3: x.n3, n2: S.con2 ? x.n2 : null, areas: pesosExtra(x) })));
    M.claves.map(([n]) => n).sort((a, b) => a - b).forEach(n => { f['P' + n] = S.resp[n] ?? ''; });
    f.modelo_top10 = N.ranking_ids.join('|');
    f.modelo_posicion_carrera = N.propia?.posicion ?? '';
    f.modelo_afinidad_carrera = N.propia ? Math.round(N.propia.afinidad * 10) / 10 : '';
    CODIGOS.forEach(a => { const ar = N.areas.find(x => x.codigo === a); f['int_' + a] = ar.interes.percentil; f['ren_' + a] = ar.rendimiento.percentil; f['zona_' + a] = ar.zona.clave; });
    return f;
  }
  async function enviar(fila) {
    try { localStorage.setItem('encuesta-' + codigo, JSON.stringify(fila)); } catch (_) {}
    if (!ENDPOINT) return 'vista previa';
    try {
      if (/script\.google\.com/.test(ENDPOINT)) {           // Google Apps Script: no devuelve CORS, se envía a ciegas
        await fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(fila) });
        return 'enviado';
      }
      const r = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fila) });
      const j = await r.json().catch(() => ({}));
      return r.ok && j.ok ? 'enviado' : 'error';
    } catch (_) { return 'error'; }
  }

  function pintarResultado(v) {
    const N = S.resultado, F = window.FIGURAS;
    const top = N.carreras.slice(0, 3);
    const est = S.enviado === 'enviado' ? 'Tus respuestas se guardaron. ¡Gracias por participar!'
      : S.enviado === 'error' ? 'No pudimos enviar tus respuestas. Revisa tu conexión y vuelve a intentarlo.'
      : S.enviado === 'vista previa' ? 'Vista previa: esta versión no envía respuestas.' : 'Guardando…';
    v.innerHTML = `<div class="tarjeta">
      <div class="aviso">${esc(est)} ${S.enviado === 'error' ? '<button class="boton sec" id="reintentar" style="margin-left:8px">Reintentar</button>' : ''}</div>
      <div><span class="etiqueta">Tu resultado · ${esc(nombre)} (nombre ficticio)</span><h2>Las 3 profesiones más cercanas a tu perfil</h2></div>
      <div class="figuras">${top.map(c => { const o = F.outfitFor(c.nombre); return `<div class="figura"><div aria-hidden="true">${F.figureSVG(o, null)}</div><div class="nm">${esc(c.nombre)}</div><div class="pc">${Math.round(c.afinidad)} <span class="sutil">afinidad</span></div><div class="sutil">${esc([c.universidad, c.ciudad].filter(Boolean).join(' · '))}</div></div>`; }).join('')}</div>
      ${N.propia ? `<div class="propia"><span class="pos">#${N.propia.posicion}</span><div><b>${esc(N.propia.nombre)}</b>, la carrera que estudias, ocupa el puesto ${N.propia.posicion} de ${CAT.lista.length} para tu perfil (afinidad ${Math.round(N.propia.afinidad)}).</div></div>` : ''}
      <div><h3 style="margin-bottom:10px">Tus 7 áreas</h3>
        <div class="areas-cab sutil"><span></span><span>Te gusta</span><span>Te va bien</span></div>
        <div class="areas-r">${N.areas.map(a => `<div class="area-r"><b>${esc(CORTO[a.codigo])}</b>
          <span class="bar"><span class="bar-t"><i style="width:${a.interes.percentil}%"></i><span class="m"></span></span><span class="mono">${a.interes.percentil}</span></span>
          <span class="bar"><span class="bar-t"><i style="width:${a.rendimiento.percentil}%"></i><span class="m"></span></span><span class="mono">${a.rendimiento.percentil}</span></span></div>`).join('')}</div>
        <p class="sutil" style="margin-top:8px">Percentil frente a un grupo de referencia; la línea marca el promedio (50).</p></div>
      <p class="sutil">Este resultado es una orientación, no un diagnóstico. Tus respuestas nos ayudan a comprobar si el sistema acierta.</p></div>`;
  }

  /* ── Validación y navegación ── */
  function enlazar() {
    const err = t => { const e = $('#err'); if (e) e.textContent = t; return false; };
    $('#ant')?.addEventListener('click', () => { if (S.paso === 3 && S.pagina > 0) { S.pagina--; pintar(); window.scrollTo({ top: 0 }); } else ir(S.paso - 1); });
    if (S.paso === 1) {
      $('#carrera').addEventListener('change', e => { $('#campo-otra').hidden = e.target.value !== 'otra'; });
    }
    if (S.paso === 2) {
      $('#con2').addEventListener('change', e => { S.con2 = e.target.checked; pintar(); });
      document.querySelectorAll('[data-quitar]').forEach(b => b.addEventListener('click', () => {
        const i = +b.dataset.quitar; S.quitadas.push(i); delete S.notas3[i]; delete S.notas2[i]; pintar();
      }));
      document.querySelectorAll('[data-restaurar]').forEach(b => b.addEventListener('click', () => {
        S.quitadas = S.quitadas.filter(i => i !== +b.dataset.restaurar); pintar();
      }));
      $('#agregar')?.addEventListener('click', () => { S.extra.push({ nombre: '', n3: null, n2: null, area: '' }); pintar(); document.querySelector(`.fila-extra[data-x="${S.extra.length - 1}"] .x-nombre`)?.focus(); });
      document.querySelectorAll('.fila-extra').forEach(f => {
        const i = +f.dataset.x, x = S.extra[i];
        const info = () => {
          const t = textoClasif(x), div = f.querySelector('.x-info'), sel = div.querySelector('.x-area');
          if (t.manual && sel) return;                       // ya pide el área: no se redibuja para no perder la selección
          if (!t.manual) x.area = '';
          div.innerHTML = t.html + (t.manual ? `<select class="x-area" aria-label="Área relacionada"><option value="">¿Con qué se relaciona?</option>${CODIGOS.map(a => `<option value="${a}">${esc(AREAS[a])}</option>`).join('')}<option value="ninguna">No sé (no se usará)</option></select>` : '');
          div.querySelector('.x-area')?.addEventListener('change', e => { x.area = e.target.value; });
        };
        f.querySelector('.x-nombre').addEventListener('input', e => { x.nombre = e.target.value; info(); });
        f.querySelector('.x-n3').addEventListener('input', e => { x.n3 = e.target.value === '' ? null : parseFloat(e.target.value); });
        f.querySelector('.x-n2')?.addEventListener('input', e => { x.n2 = e.target.value === '' ? null : parseFloat(e.target.value); });
        f.querySelector('.x-area')?.addEventListener('change', e => { x.area = e.target.value; });
        f.querySelector('.quitar').addEventListener('click', () => { S.extra.splice(i, 1); pintar(); });
      });
      document.querySelectorAll('input[data-a]').forEach(i => i.addEventListener('input', () => {
        const val = i.value === '' ? null : parseFloat(i.value);
        (i.dataset.a === '3' ? S.notas3 : S.notas2)[i.dataset.i] = (val == null || isNaN(val)) ? null : val;
      }));
    }
    if (S.paso === 3) {
      const responder = (li, v) => {
        const k = li.dataset.k;
        if (k.startsWith('a')) S.aten[+k.slice(1)] = v; else S.resp[+k] = v;
        li.classList.add('ok'); li.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === v)));
        li.nextElementSibling?.focus();
        pintarProgreso();
      };
      $('#vista').querySelectorAll('.preguntas li').forEach(li => {
        li.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) responder(li, +b.dataset.v); });
        li.addEventListener('keydown', e => { if (e.key === 's' || e.key === 'S') responder(li, 1); if (e.key === 'n' || e.key === 'N') responder(li, 0); });
      });
    }
    if (S.paso === 4) {
      document.querySelectorAll('[data-campo]').forEach(g => g.addEventListener('click', e => {
        const b = e.target.closest('[data-v]'); if (!b) return;
        S.final[g.dataset.campo] = b.dataset.v;
        g.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-checked', String(x === b)));
      }));
    }
    $('#reintentar')?.addEventListener('click', async () => { S.enviado = null; pintar(); S.enviado = await enviar(filaPlana(S.resultado)); pintar(); });
    $('#sig')?.addEventListener('click', async () => {
      if (S.paso === 0) return ir(1);
      if (S.paso === 1) {
        S.perfil = { colegio: $('#colegio').value, carrera: $('#carrera').value, otra: $('#otra')?.value.trim(), semestre: $('#semestre').value };
        if (!S.perfil.colegio || !S.perfil.carrera || !S.perfil.semestre) return err('Completa las tres preguntas para continuar.');
        if (S.perfil.carrera === 'otra' && !S.perfil.otra) return err('Escribe el nombre de tu carrera.');
        return ir(2);
      }
      if (S.paso === 2) {
        const extras = S.extra.filter(x => x.nombre.trim() || x.n3 != null);
        const vals = [...Object.values(S.notas3), ...(S.con2 ? Object.values(S.notas2) : []), ...extras.flatMap(x => [x.n3, S.con2 ? x.n2 : null])].filter(x => x != null && !isNaN(x));
        if (vals.some(x => x < 0 || x > 10)) return err('Las notas deben estar entre 0 y 10.');
        if (extras.some(x => !x.nombre.trim() || x.n3 == null || isNaN(x.n3))) return err('En las materias agregadas, escribe el nombre y la nota de 3.º, o quítalas.');
        if (extras.some(x => !clasificar(x.nombre) && !x.area)) return err('Indica con qué área se relaciona cada materia agregada (o elige "No sé").');
        S.extra = extras;
        if (Object.values(S.notas3).filter(x => x != null).length + extras.length < 5) return err('Escribe al menos 5 notas de 3.º de Bachillerato.');
        return ir(3);
      }
      if (S.paso === 3) {
        const lote = ITEMS.slice(S.pagina * POR_PAG, (S.pagina + 1) * POR_PAG);
        const falta = lote.some(it => it.aten != null ? S.aten[it.aten] == null : S.resp[it.n] == null);
        if (falta) return err('Responde todas las preguntas de esta página.');
        if (S.pagina < PAGINAS - 1) { S.pagina++; pintar(); window.scrollTo({ top: 0 }); return; }
        S.tChasideFin = Date.now(); return ir(4);
      }
      if (S.paso === 4) {
        S.final.motivo = $('#motivo').value; S.final.otra1 = $('#otra1').value; S.final.otra2 = $('#otra2').value;
        if (!S.final.satisfaccion || !S.final.primera || !S.final.motivo || !S.final.cambiaria) return err('Responde las cuatro preguntas principales.');
        S.resultado = calcular(); S.enviado = null; ir(5);
        S.enviado = await enviar(filaPlana(S.resultado)); pintar();
      }
    });
  }

  pintarCab(); pintar();
})();

</script>
</body></html>
