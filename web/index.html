<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de Recomendación Vocacional</title>
<meta name="theme-color" content="#2f3d8a"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icono.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icono-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"><link rel="stylesheet" href="estilo.css"></head>
<body>
<header class="barra">
  <div class="marca">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="1" y="1" width="24" height="24" rx="6" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.5"/>
      <line x1="13" y1="4" x2="13" y2="22" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
      <line x1="4" y1="13" x2="22" y2="13" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
      <circle cx="18" cy="8" r="3" fill="var(--z-vc)"/>
      <circle cx="8.5" cy="17.5" r="2.4" fill="var(--z-tn)"/>
    </svg>
    <h1>Sistema de Recomendación Vocacional</h1>
  </div>
  <div class="estado" id="estado">Cargando datos…</div>
  <nav class="pestanas" role="tablist" aria-label="Vistas">
    <button role="tab" id="tab-estudiante" aria-selected="true" data-vista="estudiante">Estudiante</button>
    <button role="tab" id="tab-cohorte" aria-selected="false" data-vista="cohorte">Cohorte</button>
    <button role="tab" id="tab-gestion" aria-selected="false" data-vista="gestion">Gestión</button>
  </nav>
  <div class="usuario" id="usuario"></div>
</header>

<main class="contenido" id="contenido">
  <div class="selector" id="selector">
    <div class="combo">
      <label class="etiqueta" for="buscar">Estudiante</label>
      <div class="combo-campo">
        <input id="buscar" type="text" role="combobox" aria-expanded="false" aria-controls="opciones" aria-autocomplete="list" placeholder="Buscar por nombre: escribe y se va filtrando…" autocomplete="off">
        <button class="combo-abrir" id="combo-abrir" type="button" aria-label="Ver la lista de estudiantes">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <ul class="opciones" id="opciones" role="listbox" hidden></ul>
      </div>
      <span class="sutil" id="buscar-cuenta" aria-live="polite"></span>
    </div>
    <div class="nav-caso">
      <button class="flecha" id="anterior" type="button" aria-label="Estudiante anterior">‹</button>
      <span class="contador" id="contador"></span>
      <button class="flecha" id="siguiente" type="button" aria-label="Estudiante siguiente">›</button>
    </div>
    <div class="filtros" id="filtros" aria-label="Filtros">
      <button class="chip-f" id="f-alertas" aria-pressed="false" data-f="alertas">Con alertas</button>
      <button class="chip-f" id="f-cons" aria-pressed="false" data-f="cons">Con vocación consolidada</button>
      <button class="chip-f" id="f-ind" aria-pressed="false" data-f="ind">3+ áreas indeterminadas</button>
    </div>
  </div>
  <section id="vista-estudiante"></section>
  <section id="vista-cohorte" hidden></section>
  <section id="vista-gestion" hidden></section>
</main>
<div class="tip" id="tip" hidden></div>

<script src="figuras.js"></script>
<script src="motor.js"></script>
<script src="gestion.js"></script>
<script src="app.js"></script>
</body></html>
